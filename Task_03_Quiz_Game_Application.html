<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task 03 | Quiz Game</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#10182d,#25204b);font-family:Segoe UI,Arial;color:#f6f7ff;display:grid;place-items:center;padding:20px}
.wrap{width:min(760px,100%);background:#171f3a;border:1px solid #ffffff20;border-radius:24px;padding:30px;box-shadow:0 24px 70px #0006}
header{display:flex;justify-content:space-between;gap:15px;align-items:center}.eyebrow{color:#a99aff;font-weight:800;letter-spacing:.13em;font-size:.75rem}.score{background:#2a3155;padding:9px 13px;border-radius:30px;font-weight:700}
h1{font-size:2rem;margin:12px 0 6px}.sub{color:#aeb8d0;margin:0 0 24px}.progress{height:8px;background:#303958;border-radius:20px;overflow:hidden;margin-bottom:22px}.bar{height:100%;width:0;background:linear-gradient(90deg,#8b7bff,#43d6c8);transition:.3s}
.meta{display:flex;justify-content:space-between;color:#aeb8d0;font-size:.85rem;margin-bottom:10px}.question{font-size:1.35rem;line-height:1.4;margin:8px 0 20px}
.options{display:grid;gap:11px}.option{padding:14px 16px;background:#222c4d;border:1px solid #3b476c;border-radius:13px;text-align:left;color:white;cursor:pointer;font-size:1rem}.option:hover:not(:disabled){border-color:#a99aff;background:#2a315a}.option.selected{border-color:#9c8cff;background:#393365}.option.correct{border-color:#44d6a1;background:#16483f}.option.wrong{border-color:#ff829b;background:#542b43}
.feedback{min-height:28px;margin:14px 0;color:#c4cce0}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:12px}.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:800;cursor:pointer}.primary{background:#9b8cff;color:#11142a}.ghost{background:#303b5e;color:white}.btn:disabled{opacity:.4;cursor:not-allowed}
.result{text-align:center;padding:35px 10px}.result strong{font-size:3rem;color:#54dfc4;display:block;margin:12px}
</style></head><body><main class="wrap"><header><span class="eyebrow">SKILLCRAFT · TASK 03</span><span class="score" id="score">Score: 0</span></header><h1>Quick Quiz Challenge</h1><p class="sub">Choose the best answer. A mix of single-choice, multi-select and fill-in-the-blank questions.</p><div class="progress"><div class="bar" id="bar"></div></div><section id="game"><div class="meta"><span id="counter">Question 1 of 6</span><span id="type">SINGLE CHOICE</span></div><div class="question" id="question"></div><div id="options" class="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn ghost" id="restart">Restart</button><button class="btn primary" id="submit">Check answer</button><button class="btn primary" id="next" hidden>Next →</button></div></section></main>
<script>
const questions=[
{type:'single',q:'Which language is primarily used to structure a web page?',opts:['CSS','HTML','SQL','Python'],a:[1],ex:'HTML defines the structure and content of a web page.'},
{type:'multi',q:'Which of these are commonly used for front-end web development?',opts:['HTML','CSS','JavaScript','PostgreSQL'],a:[0,1,2],ex:'HTML, CSS and JavaScript work together in the browser.'},
{type:'blank',q:'Which CSS property changes the text colour?',answer:'color',ex:'The CSS property is color.'},
{type:'single',q:'What does CSS stand for?',opts:['Computer Style Sheets','Cascading Style Sheets','Creative Styling System','Colourful Sheet Syntax'],a:[1],ex:'CSS stands for Cascading Style Sheets.'},
{type:'multi',q:'Which actions can a stopwatch app support?',opts:['Start','Pause','Reset','Compile database'],a:[0,1,2],ex:'Start, pause and reset are standard stopwatch controls.'},
{type:'blank',q:'Which JavaScript method selects an element by its ID?',answer:'getelementbyid',ex:'document.getElementById() selects an element by its ID.'}
];
let index=0,score=0,locked=false,selected=new Set();
const $=id=>document.getElementById(id);
function render(){let q=questions[index];locked=false;selected.clear();$('counter').textContent=`Question ${index+1} of ${questions.length}`;$('type').textContent=q.type==='single'?'SINGLE CHOICE':q.type==='multi'?'MULTI SELECT':'FILL IN THE BLANK';$('question').textContent=q.q;$('score').textContent='Score: '+score;$('bar').style.width=(index/questions.length*100)+'%';$('feedback').textContent='';$('submit').hidden=false;$('next').hidden=true;$('submit').disabled=false;
$('options').innerHTML='';if(q.type==='blank'){let input=document.createElement('input');input.id='blank';input.placeholder='Type your answer…';input.style.cssText='padding:15px;border-radius:12px;border:1px solid #59658a;background:#111a32;color:white;font-size:1rem;width:100%';$('options').append(input)}else q.opts.forEach((op,i)=>{let b=document.createElement('button');b.className='option';b.textContent=(q.type==='multi'?'□ ':'◯ ')+op;b.onclick=()=>choose(i,b);$('options').append(b)})}
function choose(i,b){if(locked)return;let q=questions[index];if(q.type==='single'){selected.clear();document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));selected.add(i)}else{selected.has(i)?selected.delete(i):selected.add(i)}b.classList.toggle('selected',selected.has(i));b.textContent=(selected.has(i)?(q.type==='multi'?'☑ ':'◉ '):(q.type==='multi'?'□ ':'◯ '))+q.opts[i]}
function check(){if(locked)return;let q=questions[index],correct=false;if(q.type==='blank'){let val=$('blank').value.trim().toLowerCase().replace(/\s+/g,'');correct=val===q.answer.replace(/\s+/g,'')}else{let a=[...selected].sort().join(','),b=[...q.a].sort().join(',');correct=a===b}
locked=true;if(correct)score++;$('score').textContent='Score: '+score;$('feedback').textContent=(correct?'Correct! ':'Not quite. ')+q.ex;$('feedback').style.color=correct?'#54dfc4':'#ff9bb0';$('submit').hidden=true;$('next').hidden=false;$('bar').style.width=((index+1)/questions.length*100)+'%';document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(q.type!=='blank'&&q.a.includes(i))b.classList.add('correct');else if(selected.has(i))b.classList.add('wrong')})}
function next(){if(index<questions.length-1){index++;render()}else finish()}
function finish(){$('game').innerHTML=`<div class="result"><div class="eyebrow">QUIZ COMPLETED</div><h2>Your final score</h2><strong>${score} / ${questions.length}</strong><p>${score>=5?'Excellent work!':score>=3?'Good effort. Keep practising!':'Keep learning and try again!'}</p><button class="btn primary" onclick="location.reload()">Play again</button></div>`;$('bar').style.width='100%'}
$('submit').onclick=check;$('next').onclick=next;$('restart').onclick=()=>{index=0;score=0;render()};render();
</script></body></html>
